name: Helm Chart - 1 Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Chart version to publish (without the chart-v prefix)
        required: true
        type: string
permissions: {}

env:
  REGISTRY: ghcr.io
  CHART_PATH: chart/infra-eye

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "latest"

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Verify and create chart tag
        env:
          CHART_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(yq eval '.version' "${{ env.CHART_PATH }}/Chart.yaml")"
          if [ "$VERSION" != "$CHART_VERSION" ]; then
            echo "::error::Chart.yaml version $VERSION does not match requested version $CHART_VERSION"
            exit 1
          fi

          TAG="chart-v${CHART_VERSION}"
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            TAG_SHA="$(git rev-parse "${TAG}^{commit}")"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::${TAG} already points to ${TAG_SHA}, expected ${GITHUB_SHA}"
              exit 1
            fi
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: chart
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm chart to OCI registry
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for chart in .cr-release-packages/*.tgz; do
            [ -f "$chart" ] || continue
            helm push "$chart" oci://${{ env.REGISTRY }}/$OWNER_LC/infra-eye
            echo "Pushed $chart"
          done
