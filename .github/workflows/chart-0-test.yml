name: Helm Chart - 0 Test and Lint

description: |
  Lint and test Helm chart.

on:
  pull_request:
    branches:
      - main
    paths:
      - "chart/**"
      - ".github/workflows/chart-*.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CHART_PATH: chart/infra-eye

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "latest"

      - name: Lint Helm chart
        run: helm lint ${{ env.CHART_PATH }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "latest"

      - name: Helm unittest
        run: |
          helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest
          helm unittest ${{ env.CHART_PATH }}

      - name: Helm template dry-run
        run: helm template test-release ${{ env.CHART_PATH }}
