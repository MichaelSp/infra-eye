name: Docker - Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - "docker-v*.*.*"
    paths-ignore:
      - "chart/**"
      - ".github/workflows/chart-*.yml"
  pull_request:
    paths-ignore:
      - "chart/**"
      - ".github/workflows/chart-*.yml"
    branches:
      - main
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  CHART_PATH: chart/infra-eye

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Biome linter
        run: npx biome lint .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, lint]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    permissions:
      contents: write
      packages: write
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: repo
        run: echo "image_name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Get next version
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          prefix: "docker-"
          patchList: fix, chore, docs
          noVersionBumpBehavior: patch
          noNewCommitBehavior: current
          skipInvalidTags: true

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ steps.semver.outputs.next }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}:buildcache
            type=gha
          cache-to: |
            ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, steps.repo.outputs.image_name) || '' }}
            type=gha,mode=max

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          VERSION="${{ steps.semver.outputs.next }}"
          RELEASE_TAG="${VERSION}"

          # Create release notes
          cat > release_notes.md << EOF
          ## Docker Image Release

          \`\`\`bash
            docker pull ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}:${VERSION}
          \`\`\`

          ### Available Images
          - \`${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}:${VERSION}\`
          - \`${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}:latest\`

          ### Supported Platforms
          - linux/amd64
          - linux/arm64

          ### Build Information
          - Commit SHA: \`${{ github.sha }}\`
          - Committed by: @${{ github.actor }}
          - Build Date: ${{ github.event.head_commit.timestamp }}
          EOF

          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [ "${TAG_SHA}" != "${RELEASE_SHA}" ]; then
              echo "::error::Release ${RELEASE_TAG} already targets ${TAG_SHA}, expected ${RELEASE_SHA}"
              exit 1
            fi

            gh release edit "${RELEASE_TAG}" \
              --title "Docker Image ${VERSION}" \
              --notes-file release_notes.md \
              --latest
          else
            gh release create "${RELEASE_TAG}" \
              --target "${RELEASE_SHA}" \
              --title "Docker Image ${VERSION}" \
              --notes-file release_notes.md \
              --latest
          fi

      - name: Update Helm Chart version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION="${{ steps.semver.outputs.next }}"
          PLAIN_VERSION="${VERSION#docker-v}"

          yq eval -i ".appVersion = \"$PLAIN_VERSION\"" ${{ env.CHART_PATH }}/Chart.yaml
          yq eval -i ".version = \"$PLAIN_VERSION\"" ${{ env.CHART_PATH }}/Chart.yaml

      - name: Create Helm Chart version bump PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: chart_bump_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ github.token }}
          branch: chore/release-chart-${{ steps.semver.outputs.next }}
          base: main
          title: "chore(release): bump Helm chart version to ${{ steps.semver.outputs.next }}"
          body: "Automated Helm chart version bump after Docker image release ${{ steps.semver.outputs.next }}."
          commit-message: "chore(release): bump Helm chart version to ${{ steps.semver.outputs.next }}"
          add-paths: |
            ${{ env.CHART_PATH }}/Chart.yaml
          labels: "release, automated-pr"
          delete-branch: true

      - name: Enable auto-merge for Helm Chart version bump PR
        if: steps.chart_bump_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --squash --auto ${{ steps.chart_bump_pr.outputs.pull-request-number }}
